                </g>

                <!-- Definisi Ornamen Samping (2 Lingkaran + 1 Wajik di Tengah) -->

                    <circle cx="0" cy="-16" r="5" fill="url(#goldGrad)" />
                    <polygon points="0,-6 6,0 0,6 -6,0" fill="url(#goldGrad)" />
                    <circle cx="0" cy="16" r="5" fill="url(#goldGrad)" />
                </g>
